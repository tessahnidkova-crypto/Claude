<text x="840.0" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="33" fill="#111" letter-spacing="4">BLÍŽENCI NA PAŽI &#8212; s písmeny a květy</text>
<text x="840.0" y="89" text-anchor="middle" font-family="Georgia,serif" font-size="16.5" fill="#9a9a9a" font-style="italic">úzký svislý formát &#183; K a O jako skutečná písmena</text>
<text x="280.0" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#111" letter-spacing="1.5">1 &#183; MEZI NIMI</text>
<text x="280.0" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8b8b8b" font-style="italic">písmena uvnitř souhvězdí</text>
<text x="840.0" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#111" letter-spacing="1.5">2 &#183; KAŽDÝ SVŮJ KVĚT</text>
<text x="840.0" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8b8b8b" font-style="italic">písmeno patří ke svému květu</text>
<text x="1400.0" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#111" letter-spacing="1.5">3 &#183; PÍSMENA JAKO ZÁKLAD</text>
<text x="1400.0" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8b8b8b" font-style="italic">písmena jsou hlavní prvek</text>
